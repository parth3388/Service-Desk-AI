services:

  postgres:
    image: postgres:16
    container_name: aiservicedesk-db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aiservicedesk

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./backend
    image: parth3388/ai-service-desk-backend:v2
    container_name: aiservicedesk-backend
    restart: always

    depends_on:
      - postgres

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app


  frontend:
    build: ./frontend
    image: parth3388/ai-service-desk-frontend:v2
    container_name: aiservicedesk-frontend
    restart: always

    depends_on:
      - backend

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000

    ports:
      - "3000:3000"


volumes:
  postgres_data: